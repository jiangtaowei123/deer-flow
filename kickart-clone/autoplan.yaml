# gstack autoplan 配置 - Kickart Clone
# 借鉴 gstack 自动规划方法论

project:
  name: kickart-clone
  version: 0.1.0
  goal: 复刻字节跳动 Kickart 一站式营销创作平台
  base: DeerFlow + Stable Diffusion + JNPF6.2 + 复利系统指令集

# 自动规划迭代
iterations:
  - id: MVP-1
    name: 图像生成闭环
    duration: 1周
    status: completed
    deliverables:
      - 多场景批量图像生成
      - 商品素材解析
      - 15+ 场景模板库
    success_criteria:
      - 输入商品URL → 输出 10 张多场景图片
      - 端到端耗时 ≤ 5 分钟
    tasks:
      - id: T1.1
        title: 创建项目骨架
        status: completed
      - id: T1.2
        title: 实现 Product Parser Agent
        status: completed
      - id: T1.3
        title: 扩充场景模板库至 15 个
        status: completed
      - id: T1.4
        title: 完善 amazon-product-image skill
        status: completed
      - id: T1.5
        title: 实现批量生成 API
        status: completed
      - id: T1.6
        title: 端到端测试
        status: completed

  - id: V1-2
    name: 视频成片
    duration: 2周
    status: completed
    deliverables:
      - 故事板生成
      - 视频合成
      - TTS 旁白
    success_criteria:
      - 输入商品 URL → 输出 30s 营销视频
      - 端到端耗时 ≤ 10 分钟
    tasks:
      - id: T2.1
        title: 更新 autoplan 添加 V1 任务清单
        status: completed
      - id: T2.2
        title: 实现 Creative Agent 脚本生成
        status: completed
      - id: T2.3
        title: 实现 Storyboard Agent 分镜生成
        status: completed
      - id: T2.4
        title: 实现 Video Agent 视频合成
        status: completed
      - id: T2.5
        title: 集成 TTS 旁白
        status: completed
      - id: T2.6
        title: V1 端到端测试
        status: completed

  - id: V2-3
    name: Agent 协同
    duration: 2周
    status: completed
    deliverables:
      - Lead Agent 编排
      - 多 Agent 协同
      - 失败降级
    success_criteria:
      - Lead Agent 自主调度全流程
      - Agent 成功率 ≥ 95%
    tasks:
      - id: T3.1
        title: 更新 autoplan 添加 V2 任务清单
        status: completed
      - id: T3.2
        title: 实现 Lead Agent 编排器
        status: completed
      - id: T3.3
        title: 实现多 Agent 协同调度
        status: completed
      - id: T3.4
        title: 实现失败降级机制
        status: completed
      - id: T3.5
        title: 集成端到端编排 API
        status: completed
      - id: T3.6
        title: V2 端到端测试
        status: completed

  - id: V4-5
    name: 顶尖升级
    duration: 2周
    status: completed
    deliverables:
      - 结构化日志系统
      - 并发执行引擎
      - 实时进度推送（SSE）
      - API 鉴权与速率限制
      - 视频转场增强
      - Docker 容器化
      - 配置管理
    success_criteria:
      - 生产级可观测性（结构化日志 + Prometheus 指标）
      - 并发性能提升 3x+
      - 实时进度反馈
      - API 安全防护
      - 一键容器化部署
    tasks:
      - id: T5.1
        title: 更新 autoplan 添加 V4 任务清单
        status: completed
      - id: T5.2
        title: 实现结构化日志与配置管理
        status: completed
      - id: T5.3
        title: 实现并发执行引擎
        status: completed
      - id: T5.4
        title: 实现 SSE 实时进度推送
        status: completed
      - id: T5.5
        title: 实现 API 鉴权与速率限制
        status: completed
      - id: T5.6
        title: 实现视频转场增强
        status: completed
      - id: T5.7
        title: 实现 Docker 容器化
        status: completed
      - id: T5.8
        title: V4 顶尖升级测试
        status: completed

  - id: V5-6
    name: 智能化与生态
    duration: 2周
    status: completed
    deliverables:
      - LLM 智能创意生成
      - Web 前端界面
      - 异步任务队列
      - 对象存储集成
      - Python SDK
      - A/B 测试框架
    success_criteria:
      - AI 驱动的个性化创意生成
      - 可视化 Web UI 一键创作
      - 生产级异步任务处理
      - 产物云端存储与 CDN 分发
      - 开发者 SDK 可调用
    tasks:
      - id: T6.1
        title: 更新 autoplan 添加 V5 任务清单
        status: completed
      - id: T6.2
        title: 实现 LLM 智能创意生成
        status: completed
      - id: T6.3
        title: 实现 Web 前端界面
        status: completed
      - id: T6.4
        title: 实现异步任务队列
        status: completed
      - id: T6.5
        title: 实现对象存储集成
        status: completed
      - id: T6.6
        title: 实现 Python SDK
        status: completed
      - id: T6.7
        title: 实现 A/B 测试框架
        status: completed
      - id: T6.8
        title: V5 智能化与生态测试
        status: completed

  - id: V6-7
    name: 企业级集成与生态深化
    duration: 2周
    status: completed
    deliverables:
      - SSO 单点登录与权限矩阵
      - Webhook 事件订阅系统
      - JNPF6.2 深度集成（表单引擎+流程引擎+页面渲染）
      - 复利系统指令集扩展（资产复用+模板继承+组合编排）
      - 国际化 i18n 多语言支持
      - CI/CD pipeline 自动化
    success_criteria:
      - 企业级 SSO 鉴权与细粒度权限控制
      - 事件驱动的外部系统集成
      - JNPF6.2 低代码引擎深度嵌入
      - 复利资产可继承复用，指令可组合编排
      - 多语言界面（中/英/日）
      - 自动化测试与部署流水线
    tasks:
      - id: T7.1
        title: 更新 autoplan 添加 V6 任务清单
        status: completed
      - id: T7.2
        title: 实现 SSO 单点登录与权限矩阵
        status: completed
      - id: T7.3
        title: 实现 Webhook 事件订阅系统
        status: completed
      - id: T7.4
        title: JNPF6.2 深度集成 - 表单引擎+流程引擎+页面渲染
        status: completed
      - id: T7.5
        title: 复利系统指令集扩展 - 资产复用+模板继承+组合编排
        status: completed
      - id: T7.6
        title: 实现国际化 i18n 多语言支持
        status: completed
      - id: T7.7
        title: 实现 CI/CD pipeline 配置
        status: completed
      - id: T7.8
        title: V6 端到端测试
        status: completed

# 度量体系
metrics:
  - name: daily_videos
    description: 日成片数
    target: 10
    unit: count
  - name: daily_assets
    description: 日素材数
    target: 100
    unit: count
  - name: agent_success_rate
    description: Agent 成功率
    target: 0.95
    unit: percentage
  - name: e2e_latency
    description: 端到端耗时
    target: 300
    unit: seconds
  - name: cost_per_video
    description: 单视频成本
    target: 1.0
    unit: CNY

# 风险跟踪
risks:
  - id: R1
    description: SD WebUI 资源不足
    probability: medium
    impact: high
    mitigation: 限制并发，云端 API 兜底
  - id: R2
    description: 视频合成质量不达标
    probability: high
    impact: high
    mitigation: 先做图片序列，逐步提升
  - id: R3
    description: JNPF6.2 集成困难
    probability: medium
    impact: medium
    mitigation: 提前对接，预留适配层
