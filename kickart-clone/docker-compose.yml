# Kickart Clone - Docker Compose 一键部署
# 用法：docker-compose up -d

version: "3.8"

services:
  # ============ Kickart API 服务 ============
  kickart-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kickart-api
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - KICKART_ENVIRONMENT=production
      - KICKART_LOG_LEVEL=INFO
      - KICKART_LOG_FORMAT=json
      - KICKART_API_KEY_ENABLED=false
      - KICKART_RATE_LIMIT_ENABLED=true
      - KICKART_RATE_LIMIT_REQUESTS=60
      - KICKART_SD_WEBUI_URL=http://sd-webui:7860
      - KICKART_ENABLE_SSE=true
      - KICKART_METRICS_ENABLED=true
    volumes:
      - kickart-data:/data
      - ./logs:/data/logs
    networks:
      - kickart-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - redis

  # ============ Stable Diffusion WebUI（可选）============
  sd-webui:
    image: ghcr.io/abdbarho/stable-diffusion-webui-docker:latest
    container_name: kickart-sd-webui
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - CLI_ARGS=--api --listen --enable-insecure-extension-access
    volumes:
      - sd-models:/models
      - sd-output:/output
    networks:
      - kickart-net
    profiles:
      - with-sd  # 使用 --profile with-sd 启用
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============ Redis（用于任务队列，可选）============
  redis:
    image: redis:7-alpine
    container_name: kickart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - kickart-net
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ============ Prometheus 监控（可选）============
  prometheus:
    image: prom/prometheus:latest
    container_name: kickart-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - kickart-net
    profiles:
      - monitoring

  # ============ Grafana 仪表盘（可选）============
  grafana:
    image: grafana/grafana:latest
    container_name: kickart-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - kickart-net
    profiles:
      - monitoring
    depends_on:
      - prometheus

# ============ 网络 ============
networks:
  kickart-net:
    driver: bridge

# ============ 数据卷 ============
volumes:
  kickart-data:
  sd-models:
  sd-output:
  redis-data:
  prometheus-data:
  grafana-data:
