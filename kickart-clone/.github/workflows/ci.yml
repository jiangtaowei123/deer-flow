name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============ 代码检查 ============
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort
          if [ -f kickart-clone/requirements.txt ]; then pip install -r kickart-clone/requirements.txt; fi

      - name: Run ruff (lint)
        run: ruff check kickart-clone/ --ignore E501,W605
        continue-on-error: true

      - name: Run black --check
        run: black kickart-clone/ --check --line-length 120
        continue-on-error: true

      - name: Run isort --check
        run: isort kickart-clone/ --check-only --profile black
        continue-on-error: true

  # ============ 单元测试 ============
  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kickart-clone/requirements.txt
          pip install pytest pytest-cov requests pillow httpx

      - name: Run MVP tests (needs external SD, non-blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_workflow.py -v --tb=short
        continue-on-error: true

      - name: Run V1 tests (needs external SD, non-blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v1_workflow.py -v --tb=short
        continue-on-error: true

      - name: Run V2 tests (needs external SD, non-blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v2_workflow.py -v --tb=short
        continue-on-error: true

      - name: Run V3 tests (needs external SD, non-blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v3_workflow.py -v --tb=short
        continue-on-error: true

      - name: Run V4 tests (needs external SD, non-blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v4_workflow.py -v --tb=short
        continue-on-error: true

      - name: Run V5 tests (needs external SD, non-blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v5_workflow.py -v --tb=short
        continue-on-error: true

      - name: Run V6 tests (platform, blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v6_workflow.py -v --tb=short

      - name: Run V7 LLM router tests (platform, blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v7_llm_router.py -v --tb=short

      - name: Run V8 commercial tests (platform, blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v8_commercial.py -v --tb=short

      - name: Run V9 new endpoints tests (platform, blocking)
        working-directory: kickart-clone
        run: python -m pytest tests/e2e/test_v9_new_endpoints.py -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: kickart-clone/tests/e2e/
          retention-days: 7

  # ============ 安全扫描 ============
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit & safety
        run: pip install bandit safety

      - name: Run bandit (代码安全扫描)
        run: bandit -r kickart-clone/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run safety (依赖漏洞扫描)
        run: safety check --file kickart-clone/requirements.txt || true
        continue-on-error: true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # ============ Docker 构建 ============
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=commit-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: kickart-clone
          file: kickart-clone/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ 部署 ============
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deploying to production"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Commit: ${{ github.sha }}"

      - name: Render docker-compose
        run: |
          cd kickart-clone
          sed -i "s|build: \.|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g" docker-compose.yml
          cat docker-compose.yml
